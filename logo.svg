<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 540" role="img" aria-label="FIAE logo">
  <!-- The FIAE matrix wordmark, generated cell-for-cell from
       src/fiae/identity.py _LETTERS (the CLI banner), with the brand
       purple ramp #C084FC -> #6D28D9 applied per column exactly like
       the ANSI-256 gradient in banner(). Row runs are merged so the
       blocks are seamless, like the terminal banner. -->
  <defs>
    <style>
      /* Environment-adaptive tagline: dark ink in light mode, light gray in dark. */
      :root { --fia-text: #4c1d95; }
      @media (prefers-color-scheme: dark) { :root { --fia-text: #c4b5fd; } }
      .fia-text { fill: var(--fia-text); }
      .text-sub {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-weight: 600; font-size: 27px; letter-spacing: 6px;
        text-transform: uppercase;
      }
      .text-cli {
        font-family: ui-monospace, "JetBrains Mono", Consolas, monospace;
        font-weight: 500; font-size: 20px;
      }
      .dim { opacity: 0.55; }
    </style>
  </defs>

    <rect x="30" y="30" width="300" height="60" fill="#b87cf9"/>
    <rect x="390" y="30" width="300" height="60" fill="#a263ef"/>
    <rect x="810" y="30" width="180" height="60" fill="#8b49e6"/>
    <rect x="1110" y="30" width="300" height="60" fill="#7530dc"/>
    <rect x="30" y="90" width="60" height="60" fill="#c084fc"/>
    <rect x="390" y="90" width="120" height="60" fill="#a769f2"/>
    <rect x="750" y="90" width="60" height="60" fill="#9352e9"/>
    <rect x="990" y="90" width="60" height="60" fill="#8441e3"/>
    <rect x="1110" y="90" width="60" height="60" fill="#7c39df"/>
    <rect x="30" y="150" width="300" height="60" fill="#b87cf9"/>
    <rect x="390" y="150" width="120" height="60" fill="#a769f2"/>
    <rect x="750" y="150" width="300" height="60" fill="#8b49e6"/>
    <rect x="1110" y="150" width="300" height="60" fill="#7530dc"/>
    <rect x="30" y="210" width="60" height="60" fill="#c084fc"/>
    <rect x="390" y="210" width="120" height="60" fill="#a769f2"/>
    <rect x="750" y="210" width="60" height="60" fill="#9352e9"/>
    <rect x="990" y="210" width="60" height="60" fill="#8441e3"/>
    <rect x="1110" y="210" width="60" height="60" fill="#7c39df"/>
    <rect x="30" y="270" width="60" height="60" fill="#c084fc"/>
    <rect x="390" y="270" width="120" height="60" fill="#a769f2"/>
    <rect x="750" y="270" width="60" height="60" fill="#9352e9"/>
    <rect x="990" y="270" width="60" height="60" fill="#8441e3"/>
    <rect x="1110" y="270" width="300" height="60" fill="#7530dc"/>
    <rect x="30" y="330" width="60" height="60" fill="#c084fc"/>
    <rect x="390" y="330" width="300" height="60" fill="#a263ef"/>
    <rect x="750" y="330" width="60" height="60" fill="#9352e9"/>
    <rect x="990" y="330" width="60" height="60" fill="#8441e3"/>
    <rect x="1110" y="330" width="60" height="60" fill="#7c39df"/>

  <text x="720" y="452" text-anchor="middle" class="fia-text text-sub">Feature Intelligence &amp; Architecture Engine</text>
  <text x="720" y="490" text-anchor="middle" class="fia-text text-cli dim">&gt; pip install fiae</text>
</svg>
