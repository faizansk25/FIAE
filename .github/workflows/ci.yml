name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  workflow-lint:
    # A workflow file that fails to parse never runs — so nothing else in
    # CI can catch it. This job is the only guard: parse every workflow
    # with a strict YAML loader, then run actionlint for semantic checks
    # (invalid actions refs, bad expressions, matrix inconsistencies).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PyYAML for lint script
        run: python -m pip install pyyaml
      - name: Strict-parse every workflow YAML
        run: |
          python - <<'EOF'
          import glob, sys, yaml
          files = glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml")
          assert files, "no workflow files found"
          for f in files:
              d = yaml.safe_load(open(f, encoding="utf-8"))
              assert d.get("jobs"), f"{f}: no jobs"
              for name, job in d["jobs"].items():
                  assert "runs-on" in job, f"{f}: job {name} missing runs-on"
                  for step in job.get("steps", []):
                      assert "uses" in step or "run" in step, f"{f}: {name} step without uses/run"
              print(f"{f}: OK ({len(d['jobs'])} jobs)")
          EOF
      - name: Install actionlint
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s --
      - name: actionlint (semantic workflow checks)
        run: ./actionlint -color

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for leaked secrets (gitleaks, full history)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint (enforced baseline - zero findings)
        run: ruff check src/fiae tests tools

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev + tier1 dependencies
        run: pip install -e ".[dev,tier1]"
      - name: Generate real-data fixture (100K rows, ~19MB)
        run: python tests/real_dataset_generator.py
      - name: Run test suite
        run: python -m pytest tests/ --junitxml=pytest-results.xml
      - name: End-to-end example smoke
        run: python examples/churn/run_api.py
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: ignore

  mutation-check:
    # A green suite does not prove the tests fail when a fix is reverted.
    # This job reverts each audited fix in turn and fails if the suite does
    # not notice. Report-only on pull requests (a branch may legitimately be
    # mid-refactor); enforced on pushes to main, where an unpinned fix is a
    # hole that survives forever. Needs its own clean checkout: the tool
    # refuses to run against a dirty tracked tree.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dev + tier1 dependencies
        run: pip install -e ".[dev,tier1]"
      - name: Verify guard anchors are not stale
        run: python tools/mutation_check.py --verify
      - name: Revert each audited fix; the suite must notice
        run: python tools/mutation_check.py --verbose

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,tier1]" pytest-cov
      - name: Generate real-data fixture (100K rows, ~19MB)
        run: python tests/real_dataset_generator.py
      - name: Run suite with coverage
        run: python -m pytest tests/ --cov=fiae --cov-report=xml --cov-report=term
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
