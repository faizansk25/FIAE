name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  workflow-lint:
    # A workflow file that fails to parse never runs — so nothing else in
    # CI can catch it. This job is the only guard: parse every workflow
    # with a strict YAML loader, then run actionlint for semantic checks
    # (invalid actions refs, bad expressions, matrix inconsistencies).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Strict-parse every workflow YAML
        run: |
          python - <<'EOF'
          import glob, sys, yaml
          files = glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml")
          assert files, "no workflow files found"
          for f in files:
              d = yaml.safe_load(open(f, encoding="utf-8"))
              assert d.get("jobs"), f"{f}: no jobs"
              for name, job in d["jobs"].items():
                  assert "runs-on" in job, f"{f}: job {name} missing runs-on"
                  for step in job.get("steps", []):
                      assert "uses" in step or "run" in step, f"{f}: {name} step without uses/run"
              print(f"{f}: OK ({len(d['jobs'])} jobs)")
          EOF
      - name: Install actionlint
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s --
      - name: actionlint (semantic workflow checks)
        run: ./actionlint -color

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for leaked secrets (gitleaks, full history)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint (enforced baseline - zero findings)
        run: ruff check src/fiae tests

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev + tier1 dependencies
        run: pip install -e ".[dev,tier1]"
      - name: Run test suite
        run: python -m pytest tests/ --junitxml=pytest-results.xml
      - name: End-to-end example smoke
        run: python examples/churn/run_api.py
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: ignore

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,tier1]" pytest-cov
      - name: Run suite with coverage
        run: python -m pytest tests/ --cov=fiae --cov-report=xml --cov-report=term
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
