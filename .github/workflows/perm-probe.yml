name: perm-probe

# Ephemeral one-shot probe: verifies that the exact permission block used by
# ci-retry.yml can (1) read check-run annotations and (2) reach the
# rerun-failed-jobs endpoint under GITHUB_TOKEN. Dispatched from this branch
# only; branch is deleted immediately after.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write
  checks: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe annotations read + rerun write under GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          echo "--- probe 1: annotations read (checks: read) ---"
          if annotations=$(gh api "repos/$GH_REPO/check-runs/111957083349/annotations" --jq '.[].message' 2>&1); then
            echo "$annotations" | head -2
            case "$annotations" in
              *"not acquired by Runner"*) echo "PROBE1 PASS: annotation readable + correct content" ;;
              *) echo "PROBE1 FAIL: readable but unexpected content"; exit 1 ;;
            esac
          else
            echo "PROBE1 FAIL: $annotations"; exit 1
          fi
          echo "--- probe 2: rerun endpoint (actions: write) on a green run ---"
          echo "--- expect a state rejection (rc!=0, no 403) => auth accepted ---"
          rc=0
          out=$(gh run rerun 37468733944 --failed --repo "$GH_REPO" 2>&1) || rc=$?
          echo "rc=$rc"
          echo "out=$out"
          case "$out" in
            *"Resource not accessible"*|*"resource not accessible"*|*"403"*|*"Not Found"*|*"404"*)
              echo "PROBE2 FAIL: permission denied under GITHUB_TOKEN"; exit 1 ;;
          esac
          if [ "$rc" -eq 0 ]; then
            echo "PROBE2 PASS: rerun accepted under GITHUB_TOKEN"
          else
            echo "PROBE2 PASS: auth accepted, state rejection only (rc=$rc)"
          fi
